 const nonempty=rows.filter(r=>r.some(x=>String(x??'').trim()));
 if(!nonempty.length)throw Error('Le fichier Excel est vide.');
 const head=nonempty.shift().map(normalName),ni=head.findIndex(s=>['nom','nom et prenom','nom complet'].includes(s)),ri=head.indexOf('fonction');
 if(ni<0||ri<0)throw Error('La première ligne doit contenir les colonnes Nom et Fonction.');
 const seen=new Set(),roles={'collaborateur':'collaborateur','collaboratrice':'collaborateur','chef de mission':'manager','chef de missions':'manager','associe':'associe','associee':'associe'};
 const people=nonempty.map((row,i)=>{
  const name=String(row[ni]??'').trim(),key=normalName(name),role=roles[normalName(row[ri])];
  if(!name||!role)throw Error(`Ligne ${i+2} : nom ou fonction invalide. Fonctions : collaborateur, chef de mission, associé.`);
  if(seen.has(key))throw Error(`Nom en double : ${name}. Distinguez les homonymes dans Excel.`);
  seen.add(key);const old=previous.find(p=>normalName(p.name)===key);
  return {id:old?.id||'person-'+uid(),name,role,active:true};
 });
 if(!people.length||people.length>300)throw Error('Le fichier doit contenir entre 1 et 300 personnes.');
 return [...people,...previous.filter(p=>!seen.has(normalName(p.name))).map(p=>({...p,active:false}))];
}
async function readRosterExcel(file){
 if(!/\.xlsx$/i.test(file.name))throw Error('Enregistrez le fichier Excel au format .xlsx.');
 if(file.size>5*1024*1024)throw Error('Le fichier dépasse 5 Mo.');
 const zip=await JSZip.loadAsync(await file.arrayBuffer());
 const entries=Object.values(zip.files);if(entries.length>1000||entries.reduce((s,e)=>s+(e._data?.uncompressedSize||0),0)>20000000)throw Error('Classeur trop volumineux.');
 const parse=s=>{const doc=new DOMParser().parseFromString(s,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('Classeur Excel illisible.');return doc;};
 const nodes=(el,n)=>Array.from(el.getElementsByTagNameNS('*',n));
 const read=async path=>{const f=zip.file(path);if(!f)throw Error('Classeur Excel incomplet.');return parse(await f.async('string'));};
 const wb=await read('xl/workbook.xml'),rels=await read('xl/_rels/workbook.xml.rels');
 const sheet=nodes(wb,'sheet').find(e=>e.getAttribute('state')!=='hidden');
 if(!sheet)throw Error('Aucune feuille dans ce classeur.');
 const id=sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
 const rel=nodes(rels,'Relationship').find(e=>e.getAttribute('Id')===id);
 if(!rel||rel.getAttribute('TargetMode')==='External')throw Error('Feuille Excel non prise en charge.');
 const target=rel.getAttribute('Target');const path=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');
 const strings=zip.file('xl/sharedStrings.xml')?nodes(await read('xl/sharedStrings.xml'),'si').map(si=>nodes(si,'t').map(t=>t.textContent).join('')):[];
 const doc=await read(path);
 return nodes(doc,'row').map(row=>{const out=[];for(const cell of nodes(row,'c')){const ref=cell.getAttribute('r')||'';const letters=ref.match(/^[A-Z]+/i)?.[0];if(!letters)continue;let col=0;for(const c of letters.toUpperCase())col=col*26+c.charCodeAt(0)-64;if(col>100)continue;
 if(nodes(cell,'f').length)throw Error('Utilisez des noms et fonctions en texte, sans formules.');
 const type=cell.getAttribute('t'),v=nodes(cell,'v')[0]?.textContent||'';out[col-1]=type==='s'?strings[Number(v)]||'':type==='inlineStr'?nodes(cell,'t').map(t=>t.textContent).join(''):v;
 }return out;});
}
async function importRoster(file){
 try{if(!file)return;const rows=await readRosterExcel(file);const next=validateConfig({...config,rosterRevision:uid(),people:peopleFromRows(rows,config.people)});config=next;saveConfig();actorId=config.people.find(p=>p.active&&p.role!=='associe')?.id||config.people.find(p=>p.active)?.id||'';dossier=loadDossier();evaluatorView='settings';render();toast('Liste Excel importée et enregistrée.');}
 catch(e){toast(e.message,'error');}
}

const DEFAULT_CONFIG={format:'sga-config',schema:1,campaignId:'SGA-campagne',campaignLabel:'Évaluation annuelle',people:[
 {id:'collab-01',name:'Collaborateur 1',role:'collaborateur',active:true},
 {id:'collab-02',name:'Collaborateur 2',role:'collaborateur',active:true},
 {id:'manager-01',name:'Chef de mission 1',role:'manager',active:true},
 {id:'manager-02',name:'Chef de mission 2',role:'manager',active:true},
 {id:'partner-01',name:'Associé 1',role:'associe',active:true},
 {id:'partner-02',name:'Associé 2',role:'associe',active:true}
]};
const STORAGE_CONFIG='sga-html-config-v2:'+DEFAULT_CONFIG.campaignId+':'+(DEFAULT_CONFIG.rosterRevision||'initial');
const STORAGE_DOSSIER='sga-html-dossier-v1:';
let config=readConfig();
let actorId=config.people.find(p=>p.active)?.id||'';
let dossier=null;
let evaluatorView='home';
let currentTargetId=null;
let associateEntries=[];
let associateTargetId='';
let toastTimer;
const root=document.getElementById('app');

function readConfig(){try{const c=JSON.parse(localStorage.getItem(STORAGE_CONFIG)||'null');return validateConfig(c)||clone(DEFAULT_CONFIG);}catch{return clone(DEFAULT_CONFIG);}}
function saveConfig(){localStorage.setItem(STORAGE_CONFIG,JSON.stringify(config));}
function loadDossier(){
 if(!actorId)return null;
 const fresh=makeDossier(config,actorId);
 try{const old=JSON.parse(localStorage.getItem(STORAGE_DOSSIER+config.campaignId+':'+actorId)||'null');
 if(old&&old.catalog===CATALOG.version&&old.actor.role===fresh.actor.role){fresh.id=old.id;fresh.revision=old.revision;fresh.evaluations=fresh.evaluations.map(e=>{const saved=old.evaluations.find(o=>o.target.id===e.target.id&&o.template===e.template);return saved?{...saved,target:e.target}:e;});}
 }catch{}return fresh;
}
function saveDossier(){if(!dossier)return;dossier.revision=(dossier.revision||0)+1;localStorage.setItem(STORAGE_DOSSIER+config.campaignId+':'+actorId,JSON.stringify(dossier));}
function toast(message,type='ok'){let el=document.getElementById('toast');if(!el)return;el.textContent=message;el.className='toast '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='toast hidden';},3600);}
function person(id){return config.people.find(p=>p.id===id);}
function activePeople(){return config.people.filter(p=>p.active);}
function cardStatus(e){const p=progress(e);if(e.included===false)return ['non','Néant / non évaluée'];if(p.done===0)return ['todo','À compléter'];if(p.done<p.total)return ['draft','En cours'];return ['done','Prête'];}
function templateLabel(e){return CATALOG.grids[e.template]?.title||e.template;}
function saveField(targetId,field,value){const e=dossier.evaluations.find(x=>x.target.id===targetId);if(!e)return;e[field]=value;saveDossier();}
function setAnswer(targetId,cid,patch){const e=dossier.evaluations.find(x=>x.target.id===targetId);if(!e)return;e.answers[cid]={score:null,comment:'',advice:'',...(e.answers[cid]||{}),...patch};saveDossier();}
function header(){return `<header class="top"><div class="brand"><div class="mark"><img src="${LOGO_DATA}" alt="Logo Saint-Germain Audit"></div><div><strong>SAINT-GERMAIN AUDIT</strong><span>ÉVALUATIONS ANNUELLES</span></div></div><div class="header-right"><span class="secure"><span class="dot"></span> Données locales</span><button class="mode ${mode==='evaluator'?'active':''}" data-action="mode" data-mode="evaluator">Évaluer</button><button class="mode ${mode==='associate'?'active':''}" data-action="mode" data-mode="associate">Synthèse associés</button></div></header>`;}
let mode='evaluator';
function render(){root.innerHTML=header()+`<main class="shell">${mode==='evaluator'?renderEvaluator():renderAssociate()}</main><div id="toast" class="toast hidden"></div>`;bind();}
function renderEvaluator(){dossier=loadDossier();const actor=person(actorId);return `<div class="section-head"><div><div class="eyebrow">ESPACE ÉVALUATEUR</div><h1>Préparer ses évaluations</h1><p class="lead">Remplissez les grilles à votre rythme, comparez vos notes, puis transmettez un seul dossier aux associés.</p></div><div class="campaign"><span>Campagne</span><strong>${esc(config.campaignLabel)}</strong></div></div><div class="evaluator-controls"><label>Qui êtes-vous ?<select id="actor-select">${activePeople().map(p=>`<option value="${esc(p.id)}" ${p.id===actorId?'selected':''}>${esc(p.name)} · ${ROLE[p.role]}</option>`).join('')}</select></label><div class="control-actions"><button class="btn secondary" data-action="view" data-view="settings">Importer la liste du cabinet</button><button class="btn secondary" data-action="view" data-view="comparison">Comparer mes notes</button></div></div>${evaluatorView==='home'?renderHome(actor):evaluatorView==='form'?renderForm(actor):evaluatorView==='comparison'?renderComparison(actor):renderSettings()}`;}
function renderHome(actor){if(!actor)return `<section class="panel empty"><h2>Ajoutez une personne active pour commencer.</h2></section>`;const evaluations=dossier.evaluations;const ready=evaluations.filter(e=>progress(e).done===progress(e).total&&e.included).length;const total=evaluations.filter(e=>e.included).length;return `<section class="stats"><div><span>Grilles à préparer</span><strong>${total}<small>personnes</small></strong><p>Les questionnaires sont adaptés au rôle de la personne évaluée.</p></div><div><span>Prêtes à exporter</span><strong>${ready}<small>/${total}</small></strong><p>Une grille complète peut être contrôlée avant l’envoi.</p></div><div class="accent"><span>Barème commun</span><strong>1 — 4</strong><p>3 = niveau attendu · N/E = non évalué</p></div></section><section class="panel"><div class="panel-title"><div><div class="eyebrow">VOTRE DOSSIER</div><h2>Les personnes à évaluer</h2><p>Ouvrez une personne, enregistrez vos réponses, puis revenez ici quand vous le souhaitez.</p></div><span class="badge ${dossier.status==='final'?'green':''}">${dossier.status==='final'?'Dossier exporté':'Brouillon local'}</span></div><div class="target-grid">${evaluations.map(e=>{const p=progress(e),[cls,label]=cardStatus(e);return `<button class="target-card" data-action="open" data-target="${esc(e.target.id)}"><div class="target-top"><span class="avatar ${e.target.role}">${esc(e.target.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><span class="status ${cls}">${label}</span></div><strong>${esc(e.target.name)}</strong><small>${ROLE[e.target.role]} · ${p.done}/${p.total} critères</small><div class="bar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div><span class="target-template">${esc(templateLabel(e))}<span>›</span></span></button>`;}).join('')}</div></section><section class="before-export"><div><div class="eyebrow">AVANT TRANSMISSION</div><h2>Une vue d’ensemble pour relire votre cohérence</h2><p>Comparez rapidement vos notes personne par personne et ouvrez chaque grille pour corriger un écart.</p></div><button class="btn" data-action="view" data-view="comparison">Ouvrir la comparaison</button></section><section class="export-panel panel"><div><div class="eyebrow">DOSSIER COMPLET</div><h2>Quand tout est relu, téléchargez les fichiers</h2><p>Le JSON est le fichier de travail à transmettre. L’Excel est une copie lisible pour votre propre contrôle.</p></div><div class="export-buttons"><button class="btn" data-action="export-final">Télécharger le dossier JSON</button><button class="btn secondary" data-action="export-xlsx">Télécharger l’Excel</button><button class="btn secondary" data-action="export-txt">Télécharger le résumé texte</button></div></section>`;}
function renderForm(actor){const e=dossier.evaluations.find(x=>x.target.id===currentTargetId);if(!e)return renderHome(actor);const p=person(e.target.id)||e.target;const cs=criteria(e),pr=progress(e);const index=dossier.evaluations.findIndex(x=>x.target.id===e.target.id);const previous=dossier.evaluations[index-1],next=dossier.evaluations[index+1];return `<div class="form-head"><button class="link-button" data-action="view" data-view="home">‹ Retour à la liste</button><div class="form-title"><div><div class="eyebrow">${esc(templateLabel(e))}</div><h1>${esc(p.name)}</h1><p>${ROLE[p.role]} · ${pr.done}/${pr.total} critères renseignés</p></div><span class="badge ${e.included?'':'orange'}">${e.included?'Évaluation incluse':'Personne non évaluée'}</span></div></div><section class="panel form-options"><label class="check"><input type="checkbox" id="included" ${actor.id===e.target.id?'disabled':''} ${e.included?'checked':''}> Évaluer cette personne (décochez pour « Néant — aucune mission commune »)</label>${e.included?'':`<label>Motif obligatoire<textarea id="skip-reason" rows="2" placeholder="Ex. aucune mission commune cette année">${esc(e.skipReason)}</textarea></label>`}<label>Contexte de l’évaluation <small>Exemples de dossiers, période ou situations partagées.</small><textarea id="context" rows="2" placeholder="Quelques éléments pour éclairer vos réponses…">${esc(e.context)}</textarea></label></section>${e.included?`<div class="scale"><span><b class="s1">1</b>Point d’amélioration prioritaire</span><span><b class="s2">2</b>En-dessous du niveau attendu</span><span><b class="s3">3</b>Niveau attendu</span><span><b class="s4">4</b>Excellence</span><span><b class="sna">N/E</b>Non évalué</span></div>${renderCriteria(e)}${actor.id===e.target.id?renderSelf(e):''}`:''}<div class="form-nav"><button class="btn secondary" data-action="nav-target" data-target="${previous?.target.id||''}" ${previous?'':'disabled'}>‹ Précédente</button><button class="btn secondary" data-action="nav-target" data-target="${next?.target.id||''}" ${next?'':'disabled'}>Suivante ›</button><button class="btn" data-action="view" data-view="home">Enregistrer et revenir</button></div>`;}
function renderCriteria(e){let sec='';return CATALOG.grids[e.template].criteria.filter(c=>!c.oti||e.oti).reduce((html,c,i)=>{if(c.section!==sec){if(sec)html+='</section>';sec=c.section;html+=`<section class="criterion-section"><div class="section-label">${esc(sec)}<span>${CATALOG.grids[e.template].criteria.filter(x=>x.section===sec&&(!x.oti||e.oti)).length} critères</span></div>`;}const a=e.answers[c.id]||{score:null,comment:'',advice:''};return html+`<div class="criterion"><div class="criterion-row"><div><strong>${esc(c.label)}</strong>${c.oti?'<em>OTI SAM</em>':''}</div><div class="scores">${[1,2,3,4,'NA'].map(v=>`<label class="score ${String(a.score)===String(v)?'selected':''}"><input type="radio" name="score-${esc(c.id)}" value="${v}" ${String(a.score)===String(v)?'checked':''} data-score data-cid="${esc(c.id)}">${v==='NA'?'N/E':v}</label>`).join('')}</div></div><div class="comment-grid"><label>Commentaire<textarea rows="2" data-comment data-cid="${esc(c.id)}" placeholder="Un fait ou un exemple concret…">${esc(a.comment)}</textarea></label><label>Axe d’amélioration<textarea rows="2" data-advice data-cid="${esc(c.id)}" placeholder="Une piste utile pour progresser…">${esc(a.advice)}</textarea></label></div></div>`;},'')+'</section>';}
function renderSelf(e){return `<section class="panel self-section"><div class="eyebrow">AUTO-ÉVALUATION</div><h2>Mon bilan personnel</h2><p>Ces réponses seront présentées séparément dans la synthèse.</p>${CATALOG.prompts.map((p,i)=>`<label>${esc(p||'Bilan personnel '+(i+1))}<textarea rows="2" data-self data-index="${i}">${esc(e.selfText[i]||'')}</textarea></label>`).join('')}</section>`;}
function renderComparison(actor){const groups={};for(const e of dossier.evaluations.filter(e=>e.included)){const key=e.template+(e.oti?'|oti':'');(groups[key]??=[]).push(e);}return `<div class="subhead"><button class="link-button" data-action="view" data-view="home">‹ Retour à la liste</button><div><div class="eyebrow">CONTRÔLE AVANT EXPORT</div><h1>Comparer mes notes</h1><p>La comparaison regroupe uniquement des personnes évaluées avec le même questionnaire.</p></div></div>${Object.values(groups).map(group=>renderComparisonGroup(group)).join('')||`<section class="panel empty"><h2>Aucune évaluation incluse.</h2></section>`}<div class="form-nav"><button class="btn secondary" data-action="view" data-view="home">Retour au dossier</button><button class="btn" data-action="export-final">Télécharger le dossier JSON</button></div>`;}
function renderComparisonGroup(group){const tmpl=CATALOG.grids[group[0].template],cs=tmpl.criteria.filter(c=>!c.oti||group[0].oti);return `<section class="panel compare-panel"><div class="panel-title"><div><div class="eyebrow">${group[0].oti?'OTI SAM · ':''}${esc(tmpl.title)}</div><h2>${group.map(e=>esc(e.target.name)).join(' · ')}</h2></div><span class="badge">${cs.length} critères</span></div><div class="table-wrap"><table class="compare"><thead><tr><th>Critère</th>${group.map(e=>`<th>${esc(e.target.name)}<small>${progress(e).done}/${progress(e).total}</small></th>`).join('')}</tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.label)}</td>${group.map(e=>{const v=e.answers[c.id]?.score;return `<td class="${v==null?'missing':v==='NA'?'na':''}">${v==null?'—':v==='NA'?'N/E':v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`;}
function renderSettings(){return `<div class="subhead"><button class="link-button" data-action="view" data-view="home">‹ Retour au dossier</button><div><div class="eyebrow">PARAMÉTRAGE</div><h1>Importer la liste du cabinet</h1><p>Préparez un fichier Excel .xlsx : colonne A « Nom », colonne B « Fonction », puis une personne par ligne dans la première feuille.</p></div></div><section class="panel settings"><p>Fonctions acceptées : <strong>Collaborateur, Chef de mission, Associé</strong>. Pour une entrée ou une sortie, modifiez votre Excel et réimportez la liste complète.</p><label class="btn">Importer la liste Excel<input id="roster-import" type="file" accept=".xlsx" style="display:block;margin-top:12px"></label><div class="table-wrap"><table class="results"><thead><tr><th>Nom</th><th>Fonction</th></tr></thead><tbody>${activePeople().map(p=>`<tr><td>${esc(p.name)}</td><td>${ROLE[p.role]}</td></tr>`).join('')}</tbody></table></div><p>Les noms identiques conservent leur identifiant. Pour distinguer deux homonymes, ajoutez une précision dans Excel.</p><div class="settings-actions"><button class="btn" data-action="export-distribution">Créer la version à distribuer</button><button class="btn secondary" data-action="new-campaign">Commencer une nouvelle campagne</button></div><p class="small-note">Une nouvelle campagne ouvre des grilles vierges sans supprimer les anciennes réponses. Distribuez ensuite le même nouveau fichier HTML à toute l’équipe. Les fichiers de campagnes différentes ne peuvent pas être compilés ensemble.</p></section>`;}
function renderAssociate(){const records=flatten(associateEntries);const targets=[...new Map(records.map(r=>[r.e.target.id,r.e.target])).values()];if(!associateTargetId||!targets.some(p=>p.id===associateTargetId))associateTargetId=targets[0]?.id||'';const selected=targets.find(p=>p.id===associateTargetId);const summary=selected?summarize(records,selected.id):null;return `<div class="section-head"><div><div class="eyebrow">ESPACE ASSOCIÉS</div><h1>Compiler les évaluations reçues</h1><p class="lead">Importez les fichiers JSON des collaborateurs, chefs de mission et associés, y compris leurs auto-évaluations. Les calculs restent dans votre navigateur et chaque note garde son fichier source.</p></div><div class="campaign"><span>Fichiers importés</span><strong>${associateEntries.length}</strong></div></div><section class="import-box"><div><div class="eyebrow">ÉTAPE 1 · IMPORTER</div><h2>Déposez les dossiers reçus</h2><p>Le dossier final est refusé s’il est incomplet. Un doublon ou une version différente est signalé avant intégration.</p></div><label class="dropzone" for="dossier-input"><input id="dossier-input" type="file" accept="application/json,.json" multiple><strong>Choisir un ou plusieurs fichiers JSON</strong><span>ou déposez-les ici</span></label></section>${associateEntries.length?`<section class="panel import-list"><div class="panel-title"><div><div class="eyebrow">FICHIERS ACCEPTÉS</div><h2>${associateEntries.length} dossier${associateEntries.length>1?'s':''} intégré${associateEntries.length>1?'s':''}</h2></div><button class="btn secondary" data-action="clear-associates">Effacer la session</button></div>${associateEntries.map((x,i)=>`<div class="file-row"><span class="file-ok">✓</span><div><strong>${esc(x.dossier.actor.name)}</strong><small>${esc(x.file)} · ${x.dossier.evaluations.filter(e=>e.included).length} évaluations incluses</small></div><button class="icon-btn" data-action="remove-entry" data-index="${i}">×</button></div>`).join('')}</section><section class="summary-controls"><label>Personne à synthétiser<select id="associate-target">${targets.map(p=>`<option value="${esc(p.id)}" ${p.id===associateTargetId?'selected':''}>${esc(p.name)} · ${ROLE[p.role]}</option>`).join('')}</select></label><div><button class="btn" data-action="export-associate-xlsx">Télécharger la synthèse Excel</button><button class="btn secondary" data-action="export-associate-json">Télécharger le contrôle JSON</button></div></section>${summary?renderAssociateSummary(selected,summary):''}`:''}<section class="method-note"><strong>Contrôle des calculs</strong><p>L’Excel produit comprend une synthèse, les calculs par critère, les réponses sources, les commentaires, les auto-évaluations, les contextes et les non-évaluations. Les associés peuvent donc rapprocher chaque moyenne des notes et fichiers d’origine.</p></section>`;}
function comparisonScore(mean,sources){return mean!=null?fmt(mean):sources.some(x=>x.score==='NA')?'N/E':'—';}
function sourceDetail(x){return `<div class="source"><b>${esc(x.actor)} · ${ROLE[x.role]}</b><span>${esc(x.file)} · ${x.score==='NA'?'N/E':x.score??'—'}</span>${x.comment?`<p>${esc(x.comment)}</p>`:''}${x.advice?`<p><i>${esc(x.advice)}</i></p>`:''}</div>`;}
function renderAssociateSummary(p,s){return `<section class="panel associate-summary"><div class="profile-summary"><div><div class="eyebrow">SYNTHÈSE INDIVIDUELLE</div><h2>${esc(p.name)}</h2><p>${ROLE[p.role]} · ${s.received.length} évaluation(s) reçue(s)</p></div><div class="summary-numbers"><div><span>Moyenne reçue</span><strong>${fmt(s.overall)} <small>/ 4</small></strong></div><div><span>Auto-évaluation</span><strong>${fmt(s.selfOverall)} <small>/ 4</small></strong></div><div><span>Moyenne des associés</span><strong>${fmt(s.partnerOverall)} <small>/ 4</small></strong></div></div></div><p class="comparison-method">La moyenne reçue inclut les notes des associés, une fois chacune, et exclut l’auto-évaluation. N/E et les personnes non évaluées sont exclus des moyennes. Les moyennes globales sont les moyennes des critères renseignés hors OTI ; leurs périmètres peuvent différer selon les questionnaires.</p><div class="table-wrap"><table class="results comparison-results"><thead><tr><th>Critère</th><th>Moyenne reçue</th><th>Auto-évaluation</th><th>Notes des associés</th><th>Contrôle des sources</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td><strong>${esc(r.label)}</strong><small>${esc(r.section)}${r.oti?' · OTI (hors moyenne globale)':''}</small></td><td class="result-score">${comparisonScore(r.mean,r.sources)}<small>${r.count} note(s)</small></td><td class="result-score self-score">${comparisonScore(r.selfMean,r.selfSources)}</td><td class="partner-scores"><strong>${r.partnerMean!=null?'Moyenne : ':''}${comparisonScore(r.partnerMean,r.partnerSources)}</strong>${r.partnerSources.map(x=>`<small>${esc(x.actor)} : <b>${x.score==='NA'?'N/E':x.score??'—'}</b></small>`).join('')}</td><td><details><summary>${r.sources.length+r.selfSources.length} réponse(s)</summary>${r.sources.map(sourceDetail).join('')}${r.selfSources.length?'<p><b>Auto-évaluation</b></p>'+r.selfSources.map(sourceDetail).join(''):''}</details></td></tr>`).join('')}</tbody></table></div><p class="comparison-method">— : aucun résultat disponible (fichier non importé ou critère absent du questionnaire). N/E : critère déclaré non évalué.</p>${s.self.length?`<div class="self-result"><h3>Bilan personnel</h3>${s.self.map(r=>`<p>${esc(r.file)}</p>${CATALOG.prompts.map((prompt,i)=>r.e.selfText[i]?`<div class="self-answer"><strong>${esc(prompt)}</strong><p>${esc(r.e.selfText[i])}</p></div>`:'').join('')}`).join('')}</div>`:'<p class="comparison-method">Auto-évaluation non reçue : importez le dossier de cette personne pour compléter la comparaison.</p>'}</section>`;}

function jsonContent(){const out=clone(dossier);out.status='final';out.exportedAt=new Date().toISOString();validateDossier(out,true);return out;}
function dossierCsv(){const rows=[['Évaluateur','Personne évaluée','Questionnaire','Rubrique','Critère','Note','Commentaire','Axe d’amélioration']];for(const e of dossier.evaluations)if(e.included)for(const c of criteria(e)){const a=e.answers[c.id]||{};rows.push([dossier.actor.name,e.target.name,templateLabel(e),c.section,c.label,a.score==='NA'?'Non évalué':a.score??'',a.comment||'',a.advice||'']);}return csvText(rows);}
function csvText(rows){const q=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};return '\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');}
function textSummary(){return dossier.evaluations.map(e=>{const p=progress(e);return `${e.target.name} | ${templateLabel(e)} | ${p.done}/${p.total} | ${individualMean(e)==null?'—':fmt(individualMean(e))}/4`;}).join('\n')+'\n';}
function exportDistribution(){try{
 const page=document.documentElement.cloneNode(true);page.querySelector('#app').innerHTML='<p style="padding:30px">Ouvrez ce fichier dans votre navigateur pour commencer.</p>';
 const html=page.outerHTML;const value=JSON.stringify(config).replace(/</g,'\\u003c');
 const out=html.replace(/const DEFAULT_CONFIG=[\s\S]*?;\nconst STORAGE_CONFIG=/,()=> 'const DEFAULT_CONFIG='+value+';\nconst STORAGE_CONFIG=');
 if(!html.includes('const DEFAULT_CONFIG='))throw Error('Modèle de distribution introuvable.');download('<!doctype html>'+out,'SGA-evaluations-a-distribuer.html','text/html;charset=utf-8');toast('Version à distribuer téléchargée.');
 }catch(err){toast(err.message,'error');}}
function newCampaign(){if(!confirm('Ouvrir une nouvelle campagne avec des grilles vierges ? Les réponses précédentes restent conservées.'))return;config={...config,campaignId:'SGA-'+uid(),campaignLabel:'Évaluation annuelle'};saveConfig();dossier=loadDossier();render();toast('Nouvelle campagne créée. Téléchargez la version à distribuer.');}
function exportFinal(){try{const d=jsonContent();dossier=d;saveDossier();download(JSON.stringify(d,null,2),'SGA-'+filename(d.actor.name)+'-evaluations.json','application/json');toast('Dossier final téléchargé.');render();}catch(err){toast(err.message,'error');}}
function exportXlsx(){try{const d=jsonContent();download(xlsx(auditSheets([{dossier:d,file:'dossier-'+filename(d.actor.name)+'.json'}])),'SGA-'+filename(d.actor.name)+'-controle.xlsx');toast('Excel téléchargé.');}catch(err){toast(err.message,'error');}}
function exportTxt(){try{jsonContent();download(textSummary(),'SGA-'+filename(dossier.actor.name)+'-resume.txt','text/plain;charset=utf-8');toast('Résumé texte téléchargé.');}catch(err){toast(err.message,'error');}}
function exportAssociateXlsx(){if(!associateEntries.length)return;download(xlsx(auditSheets(associateEntries)),'SGA-synthese-associes.xlsx');toast('Synthèse Excel téléchargée.');}
function exportAssociateJson(){if(!associateEntries.length)return;const rec=flatten(associateEntries),targets=[...new Set(rec.map(r=>r.e.target.id))].map(id=>{const p=rec.find(r=>r.e.target.id===id).e.target;const s=summarize(rec,id);return {person:p,received:s.received.length,overall:s.overall,selfOverall:s.selfOverall,partnerOverall:s.partnerOverall,oti:s.oti,criteria:s.rows.map(r=>({id:r.id,section:r.section,label:r.label,mean:r.mean,count:r.count,values:r.values,selfMean:r.selfMean,selfCount:r.selfCount,selfSources:r.selfSources,partnerMean:r.partnerMean,partnerCount:r.partnerCount,partnerSources:r.partnerSources,sources:r.sources}))};});download(JSON.stringify({format:'sga-compilation',method:'Moyenne reçue : toutes les notes externes, associés inclus une fois ; auto-évaluation exclue. N/E exclus. Moyennes globales : moyenne des critères hors OTI.',campaign:associateEntries[0].dossier.campaign,files:associateEntries.map(x=>x.file),people:targets},null,2),'SGA-controle-compilation.json','application/json');toast('Contrôle JSON téléchargé.');}
function bind(){document.querySelectorAll('[data-action="mode"]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='evaluator'){dossier=loadDossier();evaluatorView='home';}render();});const actor=document.getElementById('actor-select');if(actor)actor.onchange=()=>{actorId=actor.value;dossier=loadDossier();evaluatorView='home';render();};document.querySelectorAll('[data-action="view"]').forEach(b=>b.onclick=()=>{evaluatorView=b.dataset.view;render();});document.querySelectorAll('[data-action="open"]').forEach(b=>b.onclick=()=>{currentTargetId=b.dataset.target;evaluatorView='form';render();});document.querySelectorAll('[data-action="nav-target"]').forEach(b=>b.onclick=()=>{if(b.dataset.target){currentTargetId=b.dataset.target;evaluatorView='form';render();}});document.querySelectorAll('[data-action="export-final"]').forEach(b=>b.onclick=exportFinal);document.querySelectorAll('[data-action="export-xlsx"]').forEach(b=>b.onclick=exportXlsx);document.querySelectorAll('[data-action="export-txt"]').forEach(b=>b.onclick=exportTxt);document.querySelectorAll('[data-action="export-distribution"]').forEach(b=>b.onclick=exportDistribution);document.querySelectorAll('[data-action="new-campaign"]').forEach(b=>b.onclick=newCampaign);const roster=document.getElementById('roster-import');if(roster)roster.onchange=()=>importRoster(roster.files[0]);const form=document.querySelector('.form-options');if(form){const e=dossier.evaluations.find(x=>x.target.id===currentTargetId);document.querySelectorAll('[data-score]').forEach(i=>i.onchange=()=>{setAnswer(currentTargetId,i.dataset.cid,{score:i.value==='NA'?'NA':Number(i.value)});render();evaluatorView='form';currentTargetId=e.target.id;});document.querySelectorAll('[data-comment]').forEach(i=>i.oninput=()=>setAnswer(currentTargetId,i.dataset.cid,{comment:i.value}));document.querySelectorAll('[data-advice]').forEach(i=>i.oninput=()=>setAnswer(currentTargetId,i.dataset.cid,{advice:i.value}));document.querySelectorAll('[data-self]').forEach(i=>i.oninput=()=>{e.selfText[Number(i.dataset.index)]=i.value;saveDossier();});const context=document.getElementById('context');if(context)context.oninput=()=>saveField(currentTargetId,'context',context.value);const included=document.getElementById('included');if(included)included.onchange=()=>{saveField(currentTargetId,'included',included.checked);if(!included.checked&&!e.skipReason)saveField(currentTargetId,'skipReason','Néant — aucune mission commune');render();evaluatorView='form';};const skip=document.getElementById('skip-reason');if(skip)skip.oninput=()=>saveField(currentTargetId,'skipReason',skip.value);}const input=document.getElementById('dossier-input');if(input)input.onchange=()=>readDossierFiles(input.files);const target=document.getElementById('associate-target');if(target)target.onchange=()=>{associateTargetId=target.value;render();};document.querySelectorAll('[data-action="remove-entry"]').forEach(b=>b.onclick=()=>{associateEntries.splice(Number(b.dataset.index),1);render();});document.querySelectorAll('[data-action="clear-associates"]').forEach(b=>b.onclick=()=>{associateEntries=[];associateTargetId='';render();});document.querySelectorAll('[data-action="export-associate-xlsx"]').forEach(b=>b.onclick=exportAssociateXlsx);document.querySelectorAll('[data-action="export-associate-json"]').forEach(b=>b.onclick=exportAssociateJson);}
async function readDossierFiles(files){for(const file of [...files]){try{const d=JSON.parse(await file.text());const r=mergeEntry(associateEntries,d,file.name);if(r.status==='added'){associateEntries=r.entries;toast(`${file.name} intégré.`);}else if(r.status==='duplicate')toast(`${file.name} est déjà intégré.`,'error');else toast(`Conflit : un dossier existe déjà pour ${d.actor.name}.`,'error');}catch(err){toast(`${file.name} refusé : ${err.message}`,'error');}}render();}
render();
</script></body></html>
